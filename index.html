<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Property Empire</title>
<style>
:root{--ink:#15221d;--cream:#e9ead2;--panel:#111b1c;--gold:#ffd166;--green:#38c172}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 50% 20%,#26383b,#080d10 65%);color:#fff;font:14px system-ui,Segoe UI,sans-serif;min-height:100vh}
#app{max-width:1200px;margin:auto;padding:10px}.top{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#10191dcc;border:1px solid #ffffff22;border-radius:14px;padding:9px 12px;margin-bottom:9px}
h1{font-size:clamp(18px,3vw,30px);margin:0;color:var(--gold)}.stats{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#ffffff12;border:1px solid #ffffff22;border-radius:999px;padding:6px 10px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:10px}.boardWrap{perspective:1200px;display:flex;justify-content:center;align-items:flex-start}
#board{width:min(82vw,760px);aspect-ratio:1;background:var(--cream);border:5px solid #111;display:grid;grid-template-columns:repeat(11,1fr);grid-template-rows:repeat(11,1fr);position:relative;box-shadow:0 20px 45px #000b;transform:rotateX(4deg);transform-origin:center top}
.space{position:relative;border:1px solid #1a1a1a;color:#111;background:#f3f1d8;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2px;font-size:clamp(6px,1vw,10px);font-weight:750}
.space .band{position:absolute;left:0;right:0;top:0;height:22%;background:var(--c,#bbb);border-bottom:1px solid #222}.space .name{z-index:1;margin-top:15%;line-height:1.05}.space .price{font-size:.85em;z-index:1}.corner{font-size:clamp(8px,1.3vw,13px);background:#dce6cf}.owned{box-shadow:inset 0 0 0 3px #38c172}
.houseRow{position:absolute;bottom:2px;display:flex;gap:1px;z-index:2}.house{width:7px;height:7px;background:#168c45;border:1px solid #083d20}.hotel{width:11px;height:8px;background:#d33;border:1px solid #611}
#center{grid-column:2/11;grid-row:2/11;background:radial-gradient(circle,#edf1d7,#c9d9c4);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#18231d;text-align:center}
#center:before{content:"";position:absolute;width:68%;height:68%;border:2px dashed #627a6c55;border-radius:50%;animation:spin 28s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.centerTitle{transform:rotate(-18deg);font-size:clamp(24px,5vw,60px);font-weight:1000;letter-spacing:-2px;text-shadow:2px 2px #fff}.centerTitle small{display:block;font-size:.24em;letter-spacing:4px}
.token{position:absolute;width:18px;height:18px;border-radius:50%;z-index:8;border:2px solid #fff;box-shadow:0 2px 5px #000;transition:left .22s ease,top .22s ease}.p1{background:#e63946}.p2{background:#2676ff}
.side{background:#10191ddd;border:1px solid #ffffff22;border-radius:14px;padding:10px;min-height:400px}.side h2{margin:3px 0 8px;color:var(--gold);font-size:17px}
button{border:0;border-radius:10px;padding:10px 12px;font-weight:800;cursor:pointer;background:#e7e7d4;color:#16211b;box-shadow:0 3px 0 #777}button:active{transform:translateY(2px);box-shadow:0 1px 0 #777}button.primary{background:var(--gold)}button.buy{background:#48c774}button:disabled{opacity:.4;cursor:not-allowed}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:8px 0}.card{background:#ffffff0b;border:1px solid #ffffff18;border-radius:10px;padding:9px;margin:8px 0}.log{height:180px;overflow:auto;font-size:12px;line-height:1.45;background:#05090a;padding:8px;border-radius:8px}.dice{font-size:28px;letter-spacing:5px;text-align:center;min-height:40px}
@media(max-width:850px){.layout{grid-template-columns:1fr}.side{min-height:0}#board{width:min(96vw,700px)}.log{height:120px}}
</style>
</head>
<body><div id="app">
<div class="top"><h1>PROPERTY EMPIRE</h1><div class="stats"><span class="pill" id="turn">Your turn</span><span class="pill">💵 You: $<b id="cash">1500</b></span><span class="pill">🤖 Rival: $<b id="aiCash">1500</b></span></div></div>
<div class="layout"><div class="boardWrap"><div id="board"><div id="center"><div class="centerTitle">PROPERTY<br>EMPIRE<small>BUY • BUILD • RULE</small></div></div><div id="t1" class="token p1"></div><div id="t2" class="token p2"></div></div></div>
<aside class="side"><h2>Empire Console</h2><div class="dice" id="dice">⚄ ⚂</div><div class="actions"><button class="primary" id="roll">ROLL DICE</button><button id="end">END TURN</button><button class="buy" id="buy" disabled>BUY PROPERTY</button><button id="build" disabled>BUILD HOUSE</button></div>
<div class="card" id="property">Land on a property to inspect it.</div>
<div class="card"><b>Rules</b><br>Pass START: +$200. Buy unowned streets. Rent is charged automatically. Build houses on your properties for stronger rent. Five builds becomes a hotel.</div>
<div class="log" id="log"></div></aside></div></div>
<script>
const data=[
["START","corner",0],["Copper Lane","#8b5a2b",60],["Community","event",0],["Maple Street","#8b5a2b",60],["Income Tax","tax",100],["North Rail","rail",200],["Azure Ave","#69b7e8",100],["Chance","event",0],["Sky Street","#69b7e8",100],["Harbor Road","#69b7e8",120],["JAIL","corner",0],
["Rose Avenue","#d65aa5",140],["Power Co.","utility",150],["Garden Blvd","#d65aa5",140],["Crown Street","#d65aa5",160],["East Rail","rail",200],["Sunset Ave","#f39b36",180],["Community","event",0],["Market Street","#f39b36",180],["Amber Road","#f39b36",200],["FREE PARK","corner",0],
["Ruby Avenue","#df3e3e",220],["Chance","event",0],["King Street","#df3e3e",220],["Royal Blvd","#df3e3e",240],["South Rail","rail",200],["Gold Avenue","#f2d03b",260],["Pearl Street","#f2d03b",260],["Water Co.","utility",150],["Victory Road","#f2d03b",280],["GO TO JAIL","corner",0],
["Emerald Ave","#31a66a",300],["Pacific St.","#31a66a",300],["Community","event",0],["Grand Avenue","#31a66a",320],["West Rail","rail",200],["Chance","event",0],["Indigo Park","#3157a4",350],["Luxury Tax","tax",100],["Titanium Way","#3157a4",400]
];
const board=document.querySelector("#board"), own=Array(40).fill(null), builds=Array(40).fill(0);
function cell(i){
 let row,col;
 if(i<=10){row=11;col=11-i}else if(i<=20){col=1;row=21-i}else if(i<=30){row=1;col=i-19}else{col=11;row=i-29}
 return {row,col};
}
data.forEach((d,i)=>{let c=cell(i),el=document.createElement("div");el.className="space "+(d[1]=="corner"?"corner":"");el.id="s"+i;el.style.gridRow=c.row;el.style.gridColumn=c.col;
 let color=d[1][0]=="#"?d[1]:(d[1]=="rail"?"#555":d[1]=="utility"?"#a7d8d0":"#bbb");
 el.style.setProperty("--c",color);el.innerHTML=(d[1][0]=="#"||["rail","utility"].includes(d[1])?'<div class="band"></div>':'')+'<div class="name">'+d[0]+'</div>'+(d[2]?'<div class="price">$'+d[2]+'</div>':'')+'<div class="houseRow" id="h'+i+'"></div>';board.appendChild(el)
});
let P=[{pos:0,cash:1500},{pos:0,cash:1500}],active=0,rolled=false,lastRoll=0;
const log=t=>{let e=document.querySelector("#log");e.innerHTML=t+"<br>"+e.innerHTML};
function refresh(){
 cash.textContent=P[0].cash;aiCash.textContent=P[1].cash;turn.textContent=active?"Rival turn":"Your turn";
 ["t1","t2"].forEach((id,j)=>{let c=cell(P[j].pos),b=board.getBoundingClientRect(),s=document.querySelector("#s"+P[j].pos).getBoundingClientRect(),t=document.querySelector("#"+id);t.style.left=(s.left-b.left+s.width/2-9+(j?7:-7))+"px";t.style.top=(s.top-b.top+s.height/2-9)+"px"});
 document.querySelectorAll(".space").forEach((e,i)=>e.classList.toggle("owned",own[i]!=null));
 let i=P[0].pos,d=data[i],buyable=d[2]&&["tax"].indexOf(d[1])<0&&!own[i];
 buy.disabled=active||!buyable||P[0].cash<d[2];build.disabled=active||own[i]!==0||P[0].cash<Math.max(50,Math.floor(d[2]/2))||builds[i]>=5;
 property.innerHTML="<b>"+d[0]+"</b><br>"+(d[2]?"Value $"+d[2]:"Special space")+(own[i]!=null?"<br>Owner: "+(own[i]?"Rival":"You")+" • Buildings: "+builds[i]:"");
}
async function move(who,n){for(let k=0;k<n;k++){let old=P[who].pos;P[who].pos=(old+1)%40;if(P[who].pos==0){P[who].cash+=200;log((who?"Rival":"You")+" passed START +$200")}refresh();await new Promise(r=>setTimeout(r,90))}land(who)}
function land(who){let i=P[who].pos,d=data[i];log((who?"Rival":"You")+" landed on "+d[0]);
 if(d[1]=="tax"){P[who].cash-=d[2];log("Tax paid: $"+d[2])}
 if(d[0]=="GO TO JAIL"){P[who].pos=10;log((who?"Rival":"You")+" sent to jail")}
 if(d[1]=="event"){let amt=[-100,-50,50,100,150][Math.floor(Math.random()*5)];P[who].cash+=amt;log((amt>=0?"Lucky break +$":"Unexpected bill -$")+Math.abs(amt))}
 if(d[2]&&d[1]!="tax"&&own[i]!=null&&own[i]!=who){let rent=Math.floor(d[2]*.12)*(1+builds[i]);P[who].cash-=rent;P[own[i]].cash+=rent;log("Rent paid: $"+rent)}
 if(P[who].cash<0){alert((who?"Rival":"You")+" went bankrupt! "+(who?"YOU WIN!":"RIVAL WINS!"));location.reload()}refresh()}
roll.onclick=()=>{if(active||rolled)return;rolled=true;let a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6);lastRoll=a+b;dice.textContent="⚀⚁⚂⚃⚄⚅"[a-1]+" "+"⚀⚁⚂⚃⚄⚅"[b-1];roll.disabled=true;move(0,a+b)}
buy.onclick=()=>{let i=P[0].pos,d=data[i];if(!own[i]&&d[2]&&P[0].cash>=d[2]){P[0].cash-=d[2];own[i]=0;log("Purchased "+d[0]+" for $"+d[2]);refresh()}}
build.onclick=()=>{let i=P[0].pos,c=Math.max(50,Math.floor(data[i][2]/2));if(own[i]===0&&P[0].cash>=c&&builds[i]<5){P[0].cash-=c;builds[i]++;renderBuildings(i);log(builds[i]==5?"Hotel completed on "+data[i][0]:"House built on "+data[i][0]);refresh()}}
function renderBuildings(i){let h=document.querySelector("#h"+i);h.innerHTML=builds[i]==5?'<i class="hotel"></i>':Array(builds[i]).fill('<i class="house"></i>').join("")}
end.onclick=()=>{if(active)return;active=1;rolled=false;roll.disabled=true;refresh();setTimeout(aiTurn,500)}
async function aiTurn(){let a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6);dice.textContent="⚀⚁⚂⚃⚄⚅"[a-1]+" "+"⚀⚁⚂⚃⚄⚅"[b-1];await move(1,a+b);let i=P[1].pos,d=data[i];
 if(d[2]&&d[1]!="tax"&&own[i]==null&&P[1].cash>d[2]+250){P[1].cash-=d[2];own[i]=1;log("Rival bought "+d[0])}
 if(own[i]===1&&builds[i]<5&&P[1].cash>500&&Math.random()<.45){let c=Math.max(50,Math.floor(d[2]/2));P[1].cash-=c;builds[i]++;renderBuildings(i);log("Rival developed "+d[0])}
 active=0;rolled=false;roll.disabled=false;refresh()}
window.addEventListener("resize",refresh);log("Welcome to Property Empire. Roll the dice!");refresh();
</script></body></html>
