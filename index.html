<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Lunar Monopoly</title>
<style>
  :root{
    --ink:#172033; --paper:#fff8dc; --panel:#ffffffee; --accent:#ff4d6d; --gold:#ffd166;
    --blue:#5ec8ff; --green:#69db7c; --purple:#b197fc;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:linear-gradient(#7dd3fc 0 45%,#9be564 45% 100%);font-family:Trebuchet MS,Arial,sans-serif;color:var(--ink);overflow:hidden}
  body:before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.14;
    background-image:radial-gradient(circle at 20% 18%,#fff 0 5px,transparent 6px),
                     radial-gradient(circle at 70% 15%,#fff 0 4px,transparent 5px);
    background-size:160px 120px,190px 150px;
  }
  #app{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:8px;padding:8px}
  header,.hud,#controls{
    background:var(--panel);border:4px solid var(--ink);border-radius:18px;
    box-shadow:0 6px 0 #0002, inset 0 0 0 3px #fff;
  }
  header{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;min-height:54px}
  h1{margin:0;font-size:clamp(18px,4vw,31px);letter-spacing:1px;text-transform:uppercase}
  .tag{font-size:12px;font-weight:900;background:var(--gold);border:3px solid var(--ink);border-radius:999px;padding:5px 9px;transform:rotate(-2deg)}
  #stage{position:relative;min-height:0}
  canvas{width:100%;height:100%;display:block;border:4px solid var(--ink);border-radius:22px;background:#8ed7ff;box-shadow:0 8px 0 #0002}
  .hud{position:absolute;left:12px;top:12px;padding:8px 10px;min-width:174px}
  .hudRow{display:flex;justify-content:space-between;gap:14px;font-size:13px;font-weight:900}
  #toast{position:absolute;left:50%;top:12px;transform:translateX(-50%) scale(.92);opacity:0;pointer-events:none;
    padding:8px 14px;background:#fff;border:4px solid var(--ink);border-radius:14px;font-weight:1000;
    box-shadow:0 6px 0 #0003;transition:.18s}
  #toast.show{opacity:1;transform:translateX(-50%) scale(1)}
  #comic{position:absolute;right:20px;top:22%;font:1000 clamp(28px,8vw,70px)/.85 Impact,Arial Black,sans-serif;
    color:#ffdf3d;-webkit-text-stroke:4px var(--ink);text-shadow:6px 6px 0 #ff477e;transform:rotate(-10deg) scale(0);pointer-events:none}
  #comic.pop{animation:pop .7s ease}
  @keyframes pop{0%{transform:rotate(-10deg) scale(0)}35%{transform:rotate(6deg) scale(1.25)}65%{transform:rotate(-4deg) scale(.96)}100%{transform:rotate(-10deg) scale(0)}}
  #controls{padding:8px;display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
  button{
    min-height:48px;border:3px solid var(--ink);border-radius:14px;background:#fff;font-weight:1000;font-size:14px;color:var(--ink);
    box-shadow:0 4px 0 #172033;cursor:pointer;touch-action:manipulation
  }
  button:active{transform:translateY(3px);box-shadow:0 1px 0 #172033}
  button.primary{background:var(--gold)}
  button.buy{background:#7ee787}
  button.end{background:#ff9aa2}
  button:disabled{opacity:.42;filter:grayscale(.6)}
  .small{font-size:11px}

  .moonBadge{
    position:absolute;right:12px;bottom:12px;z-index:3;
    background:#10152f;color:#fff;border:3px solid #172033;border-radius:999px;
    padding:7px 11px;font-size:11px;font-weight:1000;box-shadow:0 4px 0 #0004;
  }
  @media(max-width:720px){
    #app{padding:5px;gap:5px}
    header{min-height:46px;border-width:3px}
    .tag{display:none}
    #controls{grid-template-columns:repeat(3,1fr);border-width:3px}
    button{min-height:44px;font-size:12px}
    .hud{left:8px;top:8px;padding:6px 8px;min-width:150px}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Lunar Monopoly</h1>
    <div class="tag">MOON CARTOON MODE!</div>
  </header>

  <main id="stage">
    <canvas id="game"></canvas>
    <div class="hud">
      <div class="hudRow"><span>YOU</span><span id="cash">$1500</span></div>
      <div class="hudRow"><span>RIVAL</span><span id="aiCash">$1500</span></div>
      <div class="hudRow"><span>TURN</span><span id="turnText">Your turn</span></div>
    </div>
    <div id="toast">Ready!</div>
    <div id="comic">BOING!</div>
    <div class="moonBadge">🌙 LUNAR MONOPOLY</div>
  </main>

  <section id="controls">
    <button class="primary" id="rollBtn">🎲 ROLL DICE</button>
    <button class="buy" id="buyBtn" disabled>🏠 BUY</button>
    <button id="upgradeBtn" disabled>🔨 UPGRADE</button>
    <button id="cardBtn" disabled>❓ CARD</button>
    <button class="end" id="endBtn" disabled>➡ END TURN</button>
  </section>
</div>

<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
const cashEl=$('cash'),aiCashEl=$('aiCash'),turnEl=$('turnText'),toast=$('toast'),comic=$('comic');
const rollBtn=$('rollBtn'),buyBtn=$('buyBtn'),upgradeBtn=$('upgradeBtn'),cardBtn=$('cardBtn'),endBtn=$('endBtn');

let W=1200,H=760,dpr=1,board=[],tileW=100,tileH=74,ox=0,oy=0;
let particles=[],animating=false,turn=0,rolled=false,currentRoll=0;
const players=[
 {name:'YOU',cash:1500,pos:0,owner:1,color:'#ff4d6d',x:0,y:0,frame:0,facing:1},
 {name:'RIVAL',cash:1500,pos:0,owner:2,color:'#4dabf7',x:0,y:0,frame:0,facing:1}
];
const props=[
 {n:'LAUNCH!',type:'go'},
 {n:'Crater Crescent',p:90,c:'#d8d4e8'},
 {n:'Moon Mystery!',type:'card'},
 {n:'Apollo Avenue',p:110,c:'#ffd166'},
 {n:'Meteor Market',p:120,c:'#80ed99'},
 {n:'MOON JAIL',type:'jail'},
 {n:'Starlight Street',p:140,c:'#9bf6ff'},
 {n:'Cosmic Chance!',type:'card'},
 {n:'Eclipse Estate',p:160,c:'#bdb2ff'},
 {n:'Orbit Heights',p:180,c:'#a0c4ff'},
 {n:'ZERO-G FREE',type:'free'},
 {n:'Nebula North',p:200,c:'#caffbf'},
 {n:'Moon Mystery!',type:'card'},
 {n:'Comet Court',p:220,c:'#fdffb6'},
 {n:'Lunar Mall',p:240,c:'#ffc6ff'},
 {n:'GO TO MOON JAIL',type:'gotojail'},
 {n:'Galaxy Gardens',p:260,c:'#90dbf4'},
 {n:'Cosmic Chance!',type:'card'},
 {n:'Tranquility Vista',p:300,c:'#f4978e'},
 {n:'Tycho Plaza',p:340,c:'#f94144'}
].map((o,i)=>({...o,id:i,owner:0,level:0}));

function fit(){
 dpr=Math.min(2,devicePixelRatio||1);
 const r=canvas.getBoundingClientRect();
 W=Math.max(640,r.width); H=Math.max(480,r.height);
 canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
 layoutBoard(); snapPlayers();
}
function layoutBoard(){
 const margin=Math.min(W,H)*.06;
 const bw=W-margin*2,bh=H-margin*2;
 tileW=Math.min(bw/6.1,bh/4.5*1.15); tileH=tileW*.72;
 const left=(W-6*tileW)/2, top=(H-4*tileH)/2;
 board=[];
 // 20 spaces around a 6x4 perimeter
 const coords=[];
 for(let x=5;x>=0;x--)coords.push([x,3]);
 for(let y=2;y>=0;y--)coords.push([0,y]);
 for(let x=1;x<=5;x++)coords.push([x,0]);
 for(let y=1;y<=2;y++)coords.push([5,y]);
 while(coords.length<20)coords.push([5,3]);
 for(let i=0;i<20;i++) board.push({x:left+coords[i][0]*tileW,y:top+coords[i][1]*tileH,w:tileW,h:tileH});
 ox=left;oy=top;
}
function center(i){const b=board[i];return{x:b.x+b.w/2,y:b.y+b.h/2};}
function snapPlayers(){players.forEach((p,pi)=>{let c=center(p.pos);p.x=c.x+(pi?13:-13);p.y=c.y+8;});}
function roundRect(x,y,w,h,r,fill,stroke,lw=3){
 ctx.beginPath();ctx.roundRect(x,y,w,h,r); if(fill){ctx.fillStyle=fill;ctx.fill()} if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke()}
}
function txt(t,x,y,size=14,align='center',color='#172033'){
 ctx.fillStyle=color;ctx.font=`900 ${size}px Trebuchet MS`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(t,x,y);
}
function drawBoard(){
 ctx.clearRect(0,0,W,H);
 // deep-space sky and lunar ground
 let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#07132d');g.addColorStop(.5,'#111b3e');g.addColorStop(.51,'#7f8799');g.addColorStop(1,'#444a59');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // twinkling stars
 ctx.fillStyle='#fff';
 for(let i=0;i<72;i++){let x=(i*83)%W,y=(i*47)%(H*.48);let r=(i%5===0)?2:1;ctx.globalAlpha=.45+.45*Math.abs(Math.sin(performance.now()*.001+i));ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
 ctx.globalAlpha=1;
 // distant Earth
 let ex=W*.84,ey=H*.13,er=Math.max(22,Math.min(W,H)*.055);
 let eg=ctx.createRadialGradient(ex-er*.3,ey-er*.3,2,ex,ey,er);eg.addColorStop(0,'#d8fbff');eg.addColorStop(.28,'#3cc4ff');eg.addColorStop(.68,'#2068c5');eg.addColorStop(1,'#0d2b6c');
 ctx.fillStyle=eg;ctx.beginPath();ctx.arc(ex,ey,er,0,7);ctx.fill();ctx.strokeStyle='#dff9ff';ctx.lineWidth=2;ctx.stroke();
 // lunar craters
 ctx.globalAlpha=.23;ctx.strokeStyle='#111827';ctx.lineWidth=3;
 for(let i=0;i<16;i++){let x=(i*137+50)%W,y=H*.56+((i*89)%(H*.42));let r=10+(i%5)*5;ctx.beginPath();ctx.ellipse(x,y,r,r*.45,0,0,7);ctx.stroke()}
 ctx.globalAlpha=1;
 // center lunar city
 const cx=W/2,cy=H/2;
 roundRect(cx-tileW*1.7,cy-tileH*1.05,tileW*3.4,tileH*2.1,26,'#e7e9f4','#172033',4);
 ctx.save();ctx.translate(cx,cy-2);
 ctx.strokeStyle='#8ea1d9';ctx.lineWidth=4;ctx.globalAlpha=.75;ctx.beginPath();ctx.ellipse(0,0,tileW*1.28,tileH*.68,-.18,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;
 let mg=ctx.createRadialGradient(-12,-18,5,0,0,Math.max(28,tileH*.42));mg.addColorStop(0,'#fffef2');mg.addColorStop(.55,'#d7dae4');mg.addColorStop(1,'#9aa1b2');ctx.fillStyle=mg;ctx.beginPath();ctx.arc(0,0,Math.max(28,tileH*.42),0,7);ctx.fill();ctx.strokeStyle='#172033';ctx.lineWidth=3;ctx.stroke();
 ctx.globalAlpha=.18;ctx.fillStyle='#172033';for(let i=0;i<7;i++){let a=i*2.1,r=6+(i%3)*3;ctx.beginPath();ctx.arc(Math.cos(a)*18,Math.sin(a)*14,r,0,7);ctx.fill()}ctx.globalAlpha=1;ctx.restore();
 txt('LUNAR CITY',cx,cy-18,Math.max(18,tileW*.24));
 txt('BUY • BUILD • ORBIT • WIN',cx,cy+17,Math.max(10,tileW*.11));
 // little moon-base towers
 for(let i=0;i<6;i++){
  let a=i/6*Math.PI*2;let x=cx+Math.cos(a)*tileW*1.18,y=cy+Math.sin(a)*tileH*.7;
  ctx.fillStyle=['#ff595e','#ffca3a','#8ac926','#1982c4','#6a4c93','#ff924c'][i];
  ctx.beginPath();ctx.roundRect(x-10,y-20,20,20,4);ctx.fill();ctx.fillStyle='#ccd7ff';ctx.fillRect(x-2,y,4,12);
  ctx.strokeStyle='#172033';ctx.lineWidth=2;ctx.strokeRect(x-10,y-20,20,20);
 }
 props.forEach((p,i)=>{
   const b=board[i], isCorner=[0,5,10,15].includes(i);
   roundRect(b.x,b.y,b.w,b.h,10,'#fffdf0','#172033',3);
   if(p.c){ctx.fillStyle=p.c;ctx.fillRect(b.x+3,b.y+3,b.w-6,Math.max(10,b.h*.22));}
   if(p.owner){ctx.fillStyle=p.owner===1?'#ff4d6d':'#4dabf7';ctx.fillRect(b.x+5,b.y+b.h-10,b.w-10,6);}
   txt(p.n,b.x+b.w/2,b.y+b.h*.46,isCorner?Math.max(11,b.w*.12):Math.max(9,b.w*.095));
   if(p.p) txt('$'+p.p,b.x+b.w/2,b.y+b.h*.72,Math.max(9,b.w*.09));
   if(p.level>0){
     for(let h=0;h<p.level;h++){
       ctx.fillStyle='#ff7b00';ctx.fillRect(b.x+7+h*12,b.y+b.h-23,9,10);
       ctx.fillStyle='#172033';ctx.fillRect(b.x+9+h*12,b.y+b.h-20,5,7);
     }
   }
 });
}
function drawCharacter(p,idx,t){
 ctx.save();ctx.translate(p.x,p.y);
 const moving=animating&&activeMovePlayer===idx;
 const bob=moving?Math.sin(t*.025+idx)*4:Math.sin(t*.004+idx)*1.5;
 ctx.translate(0,bob);
 ctx.scale(p.facing,1);
 // shadow
 ctx.globalAlpha=.2;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(0,19,18,6,0,0,7);ctx.fill();ctx.globalAlpha=1;
 // legs running
 ctx.strokeStyle='#172033';ctx.lineWidth=5;ctx.lineCap='round';
 let stride=moving?Math.sin(t*.04)*10:2;
 ctx.beginPath();ctx.moveTo(-5,7);ctx.lineTo(-10+stride,18);ctx.stroke();
 ctx.beginPath();ctx.moveTo(5,7);ctx.lineTo(10-stride,18);ctx.stroke();
 // body
 ctx.fillStyle=p.color;ctx.strokeStyle='#172033';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(0,-3,15,20,0,0,7);ctx.fill();ctx.stroke();
 // helmet and face
 ctx.fillStyle='#dff7ff';ctx.beginPath();ctx.arc(0,-28,17,0,7);ctx.fill();ctx.stroke();
 ctx.fillStyle='#ffe0bd';ctx.beginPath();ctx.arc(0,-27,11,0,7);ctx.fill();ctx.stroke();
 ctx.fillStyle='#172033';ctx.beginPath();ctx.arc(-4,-29,1.8,0,7);ctx.arc(4,-29,1.8,0,7);ctx.fill();
 ctx.beginPath();ctx.arc(0,-24,5,0.1,Math.PI-.1);ctx.stroke();
 // antenna
 ctx.strokeStyle='#172033';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(8,-43);ctx.lineTo(13,-52);ctx.stroke();ctx.fillStyle=idx===0?'#ffd166':'#4dabf7';ctx.beginPath();ctx.arc(14,-54,4,0,7);ctx.fill();ctx.stroke();
 // arms
 ctx.beginPath();ctx.moveTo(-12,-5);ctx.lineTo(-20-stride*.35,5);ctx.stroke();
 ctx.beginPath();ctx.moveTo(12,-5);ctx.lineTo(20+stride*.35,5);ctx.stroke();
 ctx.restore();
}
let activeMovePlayer=-1;
function burst(x,y,color='#ffd166',n=18){
 for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=2+Math.random()*5;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:35+Math.random()*25,color});}
}
function drawParticles(){
 for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.life--;ctx.globalAlpha=Math.max(0,p.life/60);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill();if(p.life<=0)particles.splice(i,1)}ctx.globalAlpha=1;
}
function updateHUD(){
 cashEl.textContent='$'+players[0].cash;aiCashEl.textContent='$'+players[1].cash;
 turnEl.textContent=turn===0?'Your turn':'Rival turn';
 buyBtn.disabled=true;upgradeBtn.disabled=true;cardBtn.disabled=true;
 if(turn===0&&rolled&&!animating){
   const s=props[players[0].pos];
   if(s.p&&s.owner===0&&players[0].cash>=s.p)buyBtn.disabled=false;
   if(s.owner===1&&s.level<3&&players[0].cash>=upgradeCost(s))upgradeBtn.disabled=false;
   if(s.type==='card')cardBtn.disabled=false;
 }
 endBtn.disabled=turn!==0||!rolled||animating;
 rollBtn.disabled=rolled||animating||turn!==0;
}
function say(s,ms=1700){toast.textContent=s;toast.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>toast.classList.remove('show'),ms)}
function bam(s){comic.textContent=s;comic.classList.remove('pop');void comic.offsetWidth;comic.classList.add('pop')}
function roll(){return 1+Math.floor(Math.random()*6)+1+Math.floor(Math.random()*6)}
function movePlayer(pi,steps,done){
 animating=true;activeMovePlayer=pi;let p=players[pi],count=0;
 function step(){
   if(count>=steps){animating=false;activeMovePlayer=-1;land(pi);done&&done();updateHUD();return}
   const from=p.pos,next=(p.pos+1)%20;if(next===0){p.cash+=200;say(`${p.name} passed LAUNCH! +$200`)}
   p.pos=next;const a={x:p.x,y:p.y},c=center(next);const bx=c.x+(pi?13:-13),by=c.y+8;
   p.facing=bx>=a.x?1:-1;
   const start=performance.now(),dur=145;
   function tween(now){
     let q=Math.min(1,(now-start)/dur),ease=1-Math.pow(1-q,3);
     p.x=a.x+(bx-a.x)*ease;p.y=a.y+(by-a.y)*ease;
     if(q<1)requestAnimationFrame(tween);else{count++;setTimeout(step,20)}
   }
   requestAnimationFrame(tween);
 }
 step();
}
function land(pi){
 const p=players[pi],s=props[p.pos],c=center(p.pos);burst(c.x,c.y,p.color,14);bam(['BOING!','WHAM!','ZOOM!'][Math.floor(Math.random()*3)]);
 if(s.type==='gotojail'){say(`${p.name} got moon-cuffed!`);bam('WEE-OOO!');p.pos=5;let c2=center(5);p.x=c2.x+(pi?13:-13);p.y=c2.y+8;p.cash=Math.max(0,p.cash-50);return}
 if(s.type==='card'){say(pi===0?'Draw a lunar card!':'Rival drew a lunar card!'); if(pi===1) setTimeout(()=>drawCard(1),350); return}
 if(s.p&&s.owner&&s.owner!==p.owner){
   const rent=Math.floor(s.p*(.32+s.level*.22));p.cash-=rent;players[s.owner-1].cash+=rent;say(`${p.name} paid $${rent} rent!`);bam('KA-CHING!');
 } else if(s.p&&s.owner===0) say(pi===0?`${s.n} is for sale!`:`Rival eyes ${s.n}...`);
 else if(s.type==='free') {p.cash+=50;say('Zero-G bonus! +$50');}
 else if(s.type==='jail') say('Just visiting Moon Jail.');
 if(p.cash<0)p.cash=0;
}
function drawCard(pi){
 const p=players[pi];
 const cards=[
  ['Found a moon-mining bonus! +$120',120],
  ['Rover repair bill! -$80',-80],
  ['Moon cereal commercial! +$90',90],
  ['Meteor shield deductible! -$60',-60],
  ['Lunar broadcast royalty! +$150',150]
 ];
 const c=cards[Math.floor(Math.random()*cards.length)];p.cash=Math.max(0,p.cash+c[1]);say(c[0]);bam(c[1]>=0?'YEAH!':'BONK!');rolled=true;updateHUD();
}
function upgradeCost(s){return Math.floor(s.p*.6)+(s.level*35)}
function buyCurrent(){
 const s=props[players[0].pos];if(!s.p||s.owner||players[0].cash<s.p)return;
 players[0].cash-=s.p;s.owner=1;burst(center(s.id).x,center(s.id).y,'#7ee787',26);say(`Bought ${s.n}!`);bam('SOLD!');updateHUD();
}
function upgradeCurrent(){
 const s=props[players[0].pos],cost=upgradeCost(s);if(s.owner!==1||s.level>=3||players[0].cash<cost)return;
 players[0].cash-=cost;s.level++;say(`Upgraded ${s.n}! Level ${s.level}`);bam('BUILD!');updateHUD();
}
function aiTurn(){
 turn=1;rolled=false;updateHUD();setTimeout(()=>{
   const r=roll();currentRoll=r;say(`Rival rolled ${r}`);movePlayer(1,r,()=>{
     const s=props[players[1].pos];
     if(s.p&&s.owner===0&&players[1].cash>s.p+180&&Math.random()>.25){players[1].cash-=s.p;s.owner=2;say(`Rival bought ${s.n}!`);bam('SOLD!')}
     if(s.owner===2&&s.level<3&&players[1].cash>upgradeCost(s)+220&&Math.random()>.55){players[1].cash-=upgradeCost(s);s.level++;say('Rival upgraded!');}
     rolled=true;updateHUD();setTimeout(()=>{turn=0;rolled=false;updateHUD();say('Your turn!')},850);
   });
 },650);
}
rollBtn.addEventListener('click',()=>{
 if(animating||turn!==0||rolled)return;rolled=true;currentRoll=roll();say(`You rolled ${currentRoll}!`);bam('ROLL!');updateHUD();setTimeout(()=>movePlayer(0,currentRoll),300);
});
buyBtn.addEventListener('click',buyCurrent);
upgradeBtn.addEventListener('click',upgradeCurrent);
cardBtn.addEventListener('click',()=>{drawCard(0);cardBtn.disabled=true});
endBtn.addEventListener('click',()=>{if(turn===0&&rolled&&!animating)aiTurn()});

let last=0;
function loop(t){drawBoard();drawParticles();drawCharacter(players[0],0,t);drawCharacter(players[1],1,t);requestAnimationFrame(loop)}
window.addEventListener('resize',fit,{passive:true});
fit();updateHUD();say('Roll the dice — Lunar Monopoly starts now!',2200);requestAnimationFrame(loop);
})();
</script>
</body>
</html>
